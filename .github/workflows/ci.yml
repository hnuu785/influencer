name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: influence-be/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: influence-be
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: influence-be
        run: python3 -m pytest -q
      - name: Build production image
        run: docker build --tag influence-backend:test influence-be

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: influence-fe/package-lock.json
      - name: Install frontend dependencies
        working-directory: influence-fe
        run: npm ci
      - name: Lint frontend
        working-directory: influence-fe
        run: npm run lint
      - name: Build frontend
        working-directory: influence-fe
        env:
          API_PROXY_TARGET: http://localhost:8001
        run: npm run build

  infrastructure:
    name: CloudFormation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: Install CloudFormation linter
        run: python3 -m pip install -r infra/requirements.txt
      - name: Validate CloudFormation templates
        run: cfn-lint --regions ap-northeast-2 -- infra/*.yml
