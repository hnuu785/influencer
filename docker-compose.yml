name: influence

services:
  backend:
    build:
      context: ./influence-be
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./influence-be:/app
    environment:
      APP_ENV: development
      APP_FRONTEND_URL: http://localhost:3001
      APP_PUBLIC_API_URL: http://localhost:8001
      INVITE_CODE: ${INVITE_CODE:-STORYLOG-BETA}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-transcribe}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_GENERATION_MODEL: ${OPENAI_GENERATION_MODEL:-gpt-5.6-terra}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-gpt-5.6-sol}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-influence}
      DB_USER: ${POSTGRES_USER:-influence}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-influence}
      DB_SSL: disable
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-influence}
      POSTGRES_USER: ${POSTGRES_USER:-influence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-influence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
