name: influence

services:
  backend:
    build:
      context: ./influence-be
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./influence-be:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-influence}
      DB_USER: ${POSTGRES_USER:-influence}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-influence}
      DB_SSL: disable
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3001
      COLLECTOR_ADMIN_KEY: ${COLLECTOR_ADMIN_KEY:-}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-InfluenceCrawler/1.0}
      CRAWLER_REQUEST_DELAY_SECONDS: ${CRAWLER_REQUEST_DELAY_SECONDS:-2.0}
      CRAWLER_ALLOWED_DOMAINS: ${CRAWLER_ALLOWED_DOMAINS:-}
      INFLUENCER_PROVIDER: ${INFLUENCER_PROVIDER:-public_web}
      BRIGHTDATA_API_TOKEN: ${BRIGHTDATA_API_TOKEN:-}
      BRIGHTDATA_INSTAGRAM_PROFILE_DATASET_ID: ${BRIGHTDATA_INSTAGRAM_PROFILE_DATASET_ID:-gd_l1vikfch901nx3by4}
      BRIGHTDATA_BASE_URL: ${BRIGHTDATA_BASE_URL:-https://api.brightdata.com}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-influence}
      POSTGRES_USER: ${POSTGRES_USER:-influence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-influence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
